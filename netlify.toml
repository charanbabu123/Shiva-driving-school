# Netlify deployment configuration
# ---------------------------------
# The Next.js app is a static export, so Netlify simply publishes ./out.
# No @netlify/plugin-nextjs is needed (and it must NOT be installed — it would
# try to wrap a static export in serverless functions).

[build]
  command = "npm run build"
  publish = "out"

# Keep Netlify's HTML post-processing off. Its Pretty URLs feature rewrites
# "/page.html" to "/page", which would break the Google Search Console
# verification file at /googlee6672e337f273ab0.html — Google needs a direct 200
# on that exact path.
#
# NOTE: this does NOT stop the separate promo injection Netlify adds at the
# edge — a comment plus <meta name="hosting-provider"> and
# <meta name="netlify-deploy"> right after <head>. That injection breaks
# hydration (React #418 x3 then #423, reproduced locally in both directions:
# same build, errors only when those nodes are present), because Next's App
# Router renders <head> as part of the React tree. It has to be switched off in
# the Netlify UI: Project configuration → Build & deploy → Post processing.
# See README "Known issue: Netlify head injection".
[build.processing]
  skip_processing = true

[build.environment]
  NODE_VERSION = "20"
  # Set the real site URL here (or in the Netlify UI) so the canonical tag,
  # sitemap.xml, robots.txt and og:image all point at the production domain.
  NEXT_PUBLIC_SITE_URL = "https://shivanewtechdrivingschool.netlify.app"

# --- Security + SEO headers ------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprinted Next.js build assets never change — cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
