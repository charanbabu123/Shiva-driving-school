# Netlify deployment configuration
# ---------------------------------
# The Next.js app is a static export, so Netlify simply publishes ./out.
# No @netlify/plugin-nextjs is needed (and it must NOT be installed — it would
# try to wrap a static export in serverless functions).

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # Set the real site URL here (or in the Netlify UI) so the canonical tag,
  # sitemap.xml, robots.txt and og:image all point at the production domain.
  NEXT_PUBLIC_SITE_URL = "https://shivanewtechdrivingschool.netlify.app"

# --- Security + SEO headers ------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprinted Next.js build assets never change — cache them for a year.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
